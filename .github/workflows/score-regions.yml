name: Score models by region

# Scores the blend's models at about 65 airports around the world (tools/score_regions.py) and
# fits weights per region (the table in Packages/WeatherCore/blend-regions.json).
# Run by hand, or on a push that changes the scorer. Re-runs reuse the download cache.
# Linux: GitHub's Mac runners can't reach api.open-meteo.com.

on:
  workflow_dispatch:
  push:
    paths:
      - tools/score_regions.py
      - .github/workflows/score-regions.yml

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: tools/verify-cache
          key: regions-cache-${{ github.run_id }}
          restore-keys: regions-cache-
      - name: Airport observations
        working-directory: tools
        run: REGION_STAGE=obs python3 score_regions.py
      - name: Score
        working-directory: tools
        timeout-minutes: 300
        run: python3 score_regions.py | tee region-report.txt
      # Saved even when the run is cut short, so the next run picks up where this one stopped.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/verify-cache
          key: regions-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-results
          path: |
            tools/region-weights.json
            tools/region-report.json
            tools/region-report.txt
