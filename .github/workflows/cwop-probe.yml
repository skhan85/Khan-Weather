name: CWOP probe
# Temporary: counts CWOP weather stations near Milton on the free APRS-IS feed.
on:
  pull_request:
    paths: [tools/cwop_count.py, .github/workflows/cwop-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cwop_count.py 900
