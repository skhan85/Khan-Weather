name: Check climate normals

# Compares Open-Meteo's 1991-2020 normals (used for "warmer than usual") with ECCC station records.
# Linux: GitHub's Mac runners can't reach api.open-meteo.com.

on:
  workflow_dispatch:
  pull_request:
    paths: [tools/check_normals.py, .github/workflows/check-normals.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check
        working-directory: tools
        run: python3 check_normals.py
