name: Temp GeoMet layer check
on:
  push:
    branches: [claude/project-thread-smqcnc]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for L in HRDPS.CONTINENTAL_TT HRDPS.CONTINENTAL_UU HRDPS.CONTINENTAL_NT GDPS.ETA_TT GDPS.ETA_UU GDPS.ETA_NT RDPS.ETA_TT RDPS.ETA_UU RDPS.ETA_NT; do
            echo "== $L"
            curl -s "https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetCapabilities&layer=$L" | grep -E "<Name>|<Title>|<Dimension" | head -8
            curl -s -o /tmp/x.png -w "map %{http_code} %{content_type} %{size_download}\n" "https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetMap&layers=$L&styles=&crs=EPSG:3857&bbox=-9000000,5000000,-8500000,5500000&width=256&height=256&format=image/png&transparent=true"
            curl -s -o /tmp/l.png -w "legend %{http_code} %{content_type} %{size_download}\n" "https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetLegendGraphic&layer=$L&format=image/png&sld_version=1.1.0"
          done
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=43.52&longitude=-79.88&hourly=temperature_2m,pressure_msl&daily=temperature_2m_max&past_days=1&forecast_days=2&minutely_15=precipitation&forecast_minutely_15=12&timezone=auto&timeformat=unixtime" | head -c 1500
