name: Learner tests

# Offline tests of the relay's per-place learning maths (tools/learn).
on:
  pull_request:
    paths: ["tools/learn/**", ".github/workflows/learn-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/learn/test_learner.py
