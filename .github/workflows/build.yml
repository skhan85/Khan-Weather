name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths: ["App/**", "Packages/**", "project.yml", ".github/workflows/build.yml"]
  pull_request:
    paths: ["App/**", "Packages/**", "project.yml", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # lets builds on main publish the .ipa as a GitHub Release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test WeatherCore
        run: swift test --package-path Packages/WeatherCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and widget (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KhanWeather.xcodeproj \
            -scheme KhanWeather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/KhanWeather.app
          test -d "$APP/PlugIns/KhanWeatherWidget.appex" || { echo "Widget missing from app bundle"; exit 1; }
          # iOS only reloads a widget extension when the build number changes, so each build gets its own.
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/PlugIns/KhanWeatherWidget.appex/Info.plist"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KhanWeather-unsigned.ipa Payload
          ls -lh KhanWeather-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: KhanWeather-unsigned-ipa
          path: KhanWeather-unsigned.ipa
          retention-days: 30

      - name: Publish .ipa as a GitHub Release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp KhanWeather-unsigned.ipa "KhanWeather-${TAG}.ipa"
          gh release create "$TAG" "KhanWeather-${TAG}.ipa" \
            --target "${{ github.sha }}" \
            --title "Khan Weather ${TAG}" \
            --notes "Unsigned build of ${{ github.sha }}. Sideload with Sideloadly or Impactor using your Apple ID." \
            --latest

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  # Pull requests only: run the app in the iOS Simulator and save screenshots,
  # so design changes can be checked without a Mac.
  screenshots:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KhanWeather.xcodeproj \
            -scheme KhanWeather \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO \
            | tee sim-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim-build.log

      - name: Check forecast service from the runner
        continue-on-error: true
        run: |
          base="https://api.open-meteo.com/v1/forecast?latitude=43.52&longitude=-79.88&hourly=temperature_2m&timezone=auto&forecast_days=1"
          for m in best_match gem_seamless; do
            curl -sS -m 30 -o "om-$m.json" -w "$m: HTTP %{http_code} in %{time_total}s\n" "$base&models=$m" || true
            python3 -c "import json,sys; h=json.load(open(sys.argv[1]))['hourly']; print(' '.join(f'{t[11:13]}h:{v}' for t,v in zip(h['time'],h['temperature_2m'])))" "om-$m.json" || true
          done

      - name: Check radar and storm data from the runner
        continue-on-error: true
        run: |
          curl -sS -m 30 "https://api.rainviewer.com/public/weather-maps.json" | head -c 600; echo
          curl -sS -m 30 "https://api.open-meteo.com/v1/forecast?latitude=43.52&longitude=-79.88&hourly=cape,weather_code,wind_speed_700hPa,wind_direction_700hPa&timeformat=unixtime&past_hours=1&forecast_hours=4" | head -c 800; echo
          curl -sS -m 30 "https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=RADAR_1KM_RRAI&query_layers=RADAR_1KM_RRAI&crs=EPSG:4326&bbox=43.50,-80.20,43.52,-80.18&width=3&height=3&i=1&j=1&info_format=application/json" | head -c 600; echo
          # Radar map layers: radar (3 h), lightning and current warnings.
          for l in RADAR_1KM_RRAI Lightning_2.5km_Density Current-Alerts; do
            echo "== $l"; curl -sS -m 60 "https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetCapabilities&layer=$l" | grep -iE "<Name>|<Dimension" | head -6
          done

      - name: Take screenshots
        run: |
          set -x
          APP=simbuild/Build/Products/Debug-iphonesimulator/KhanWeather.app
          BUNDLE=com.skhan85.KhanWeather
          mkdir -p shots
          xcrun simctl list devices available
          shoot() {
            local name="$1" label="$2"
            local udid
            udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for x in devs:
                  if x['name']=='$name': print(x['udid']); sys.exit()
          ")
            [ -n "$udid" ] || { echo "No simulator named $name"; return 0; }
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$udid" "$APP"
            xcrun simctl privacy "$udid" grant location "$BUNDLE" || true
            xcrun simctl location "$udid" set 43.5183,-79.8774 || true
            # First launch asks which units to use.
            xcrun simctl launch "$udid" "$BUNDLE"
            sleep 20
            xcrun simctl io "$udid" screenshot "shots/${label}-units-question.png"
            xcrun simctl terminate "$udid" "$BUNDLE" || true
            # Launch arguments answer it for the rest (UserDefaults argument domain).
            xcrun simctl launch "$udid" "$BUNDLE" -unitsChosen YES
            sleep 45
            xcrun simctl io "$udid" screenshot "shots/${label}-main.png"
            xcrun simctl ui "$udid" appearance dark
            sleep 3
            xcrun simctl io "$udid" screenshot "shots/${label}-main-dark-mode.png"
            xcrun simctl ui "$udid" appearance light
            xcrun simctl terminate "$udid" "$BUNDLE" || true
            sleep 3
            xcrun simctl launch "$udid" "$BUNDLE" -unitsChosen YES -unitTemperature fahrenheit -unitWind mph \
              -unitPrecipitation inches -unitPressure inHg -unitDistance mi
            sleep 30
            xcrun simctl io "$udid" screenshot "shots/${label}-main-us-units.png"
            xcrun simctl terminate "$udid" "$BUNDLE" || true
            sleep 3
            xcrun simctl launch "$udid" "$BUNDLE" -unitsChosen YES -designPreview
            sleep 25
            xcrun simctl io "$udid" screenshot "shots/${label}-design-preview.png"
            xcrun simctl terminate "$udid" "$BUNDLE" || true
            sleep 2
            xcrun simctl launch "$udid" "$BUNDLE" -radarScreen
            sleep 25
            xcrun simctl io "$udid" screenshot "shots/${label}-radar-card.png"
            sleep 25
            xcrun simctl io "$udid" screenshot "shots/${label}-radar-map.png"
            xcrun simctl shutdown "$udid" || true
          }
          shoot "iPhone 16 Pro" iphone
          shoot "iPad Pro 13-inch (M4)" ipad
          ls -l shots

      # Also put them on the ci-screenshots branch, so they can be viewed on GitHub
      # (and fetched with git) without downloading a zip.
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -n "$(ls shots 2>/dev/null)" ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
          # Also per pull request, so two PRs running at once don't overwrite each other's shots.
          if [ -n "${{ github.event.pull_request.number }}" ]; then git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "ci-screenshots:ci-screenshots-pr${{ github.event.pull_request.number }}"; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 14
