name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # lets builds on main publish the .ipa as a GitHub Release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test WeatherCore
        run: swift test --package-path Packages/WeatherCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and widget (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KhanWeather.xcodeproj \
            -scheme KhanWeather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/KhanWeather.app
          test -d "$APP/PlugIns/KhanWeatherWidget.appex" || { echo "Widget missing from app bundle"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry KhanWeather-unsigned.ipa Payload
          ls -lh KhanWeather-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: KhanWeather-unsigned-ipa
          path: KhanWeather-unsigned.ipa
          retention-days: 30

      - name: Publish .ipa as a GitHub Release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp KhanWeather-unsigned.ipa "KhanWeather-${TAG}.ipa"
          gh release create "$TAG" "KhanWeather-${TAG}.ipa" \
            --target "${{ github.sha }}" \
            --title "Khan Weather ${TAG}" \
            --notes "Unsigned build of ${{ github.sha }}. Sideload with Sideloadly or Impactor using your Apple ID." \
            --latest

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
