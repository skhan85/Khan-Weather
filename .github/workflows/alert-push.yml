name: Weather notifications

# Sends severe weather alerts and rain/snow/frost heads-ups to the free ntfy app, because a
# sideloaded app on a free Apple ID can't get real push notifications and iOS seldom lets it
# check in the background. Runs the app's own logic (Packages/WeatherCore/Sources/AlertPush).
#
# Setup (repo Settings > Secrets and variables > Actions):
#   secret NTFY_TOPIC    a long random topic name; subscribe to it in the ntfy iPhone app
#   secret PUSH_PLACES   optional, "Home=43.51,-79.88;Cottage=44.6,-79.4" (each may end "@other-topic")
#                        defaults to Milton. A secret so home locations stay out of this public repo.
#   variables PUSH_ADVISORIES / PUSH_RAIN / PUSH_FROST   optional, "false" to turn one off

on:
  schedule:
    # GitHub runs scheduled jobs late when it's busy, so this is "about every 10 minutes".
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "Packages/WeatherCore/Sources/**"
      - ".github/workflows/alert-push.yml"

permissions:
  contents: read

concurrency:
  group: alert-push
  cancel-in-progress: false

jobs:
  push:
    # Linux: GitHub's Mac runners can't open a connection to api.open-meteo.com.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Nothing to do until a topic is set (pull requests still build and dry-run).
      ACTIVE: ${{ secrets.NTFY_TOPIC != '' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the build
        if: env.ACTIVE == 'true'
        uses: actions/cache@v4
        with:
          path: Packages/WeatherCore/.build
          key: alert-push-build-${{ runner.os }}-${{ hashFiles('Packages/WeatherCore/Package.swift', 'Packages/WeatherCore/Sources/**') }}
          restore-keys: alert-push-build-${{ runner.os }}-
      - name: Remember what was already sent
        if: env.ACTIVE == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: alert-push-state.json
          key: alert-push-state-${{ github.run_id }}
          restore-keys: alert-push-state-
      - name: Check and send
        if: env.ACTIVE == 'true'
        env:
          PUSH_PLACES: ${{ secrets.PUSH_PLACES }}
          PUSH_ADVISORIES: ${{ vars.PUSH_ADVISORIES }}
          PUSH_RAIN: ${{ vars.PUSH_RAIN }}
          PUSH_FROST: ${{ vars.PUSH_FROST }}
          STATE_FILE: ${{ github.workspace }}/alert-push-state.json
          # A pull request only checks that it builds and runs; it never sends.
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          swift run --package-path Packages/WeatherCore AlertPush | tee result.md
          cat result.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save memory
        if: always() && env.ACTIVE == 'true' && github.event_name != 'pull_request' && hashFiles('alert-push-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alert-push-state.json
          key: alert-push-state-${{ github.run_id }}
      - name: Not set up yet
        if: env.ACTIVE != 'true'
        run: echo "No NTFY_TOPIC secret yet, so nothing to send." >> "$GITHUB_STEP_SUMMARY"
