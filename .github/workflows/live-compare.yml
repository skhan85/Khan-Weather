name: Live compare (temporary)
on:
  push:
    branches: [claude/project-thread-mcy57x]
    paths: [".github/workflows/live-compare.yml", "Packages/WeatherCore/Sources/LiveCompare/**"]
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Observations near Milton (METAR, last 3 h)
        run: |
          curl -s "https://aviationweather.gov/api/data/metar?ids=CYYZ,CYHM,CYKF,CYTZ,CZBA&hours=3&format=raw" || true
          echo
          for s in on-143 on-77 on-85; do curl -s "https://dd.weather.gc.ca/today/citypage_weather/ON/" >/dev/null; done
          curl -s "https://api.weather.gc.ca/collections/citypageweather-realtime/items?f=json&limit=1&identifier=on-143" | python3 -c "import sys,json;d=json.load(sys.stdin);p=d['features'][0]['properties'];print(json.dumps(p.get('currentConditions',{}),default=str)[:1500])" || true
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=43.5085&longitude=-79.885&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,surface_pressure,pressure_msl,cloud_cover,visibility,uv_index,wind_speed_10m,wind_direction_10m&models=gem_hrdps_continental&timezone=America/Toronto" ; echo
      - name: App pipeline
        env: { LIVE_COMPARE: "1" }
        run: swift run --package-path Packages/WeatherCore LiveCompare 2>&1 | grep -v "  - hour" | tail -30
