name: Score daily highs and lows

# Run by hand (Actions tab) to re-score: do the app's highs run low and lows run high? (tools/score_extremes.py)
# Linux: GitHub's Mac runners can't reach api.open-meteo.com.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/score_extremes.py

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/verify-cache
          key: verify-cache-${{ github.run_id }}
          restore-keys: verify-cache-
      - name: Score
        working-directory: tools
        run: python3 score_extremes.py | tee extremes-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extremes-results
          path: |
            tools/extremes-results.json
            tools/extremes-report.txt
