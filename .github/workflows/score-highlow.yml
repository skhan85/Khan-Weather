name: Score daily high and low allowances

# Runs tools/score_highlow.py at ~70 airports worldwide (by hand, or on a push that changes it).
# Re-runs reuse the download cache. Linux: GitHub's Mac runners can't reach api.open-meteo.com.

on:
  workflow_dispatch:
  push:
    paths:
      - tools/score_highlow.py
      - .github/workflows/score-highlow.yml

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: tools/verify-cache
          key: highlow-cache-${{ github.run_id }}
          restore-keys: |
            highlow-cache-
            regions-cache-
      - name: Observations
        working-directory: tools
        run: HL_STAGE=obs python3 score_highlow.py
      - name: Score
        working-directory: tools
        timeout-minutes: 300
        run: python3 score_highlow.py | tee highlow-report.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/verify-cache
          key: highlow-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: highlow-results
          path: |
            tools/highlow-report.json
            tools/highlow-report.txt
