name: Score rain vs snow

# Run by hand (Actions tab) to re-score: which rule calls rain vs snow best? (tools/score_ptype.py)
# Linux: GitHub's Mac runners can't reach api.open-meteo.com.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/score_ptype.py

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/verify-cache
          key: verify-cache-${{ github.run_id }}
          restore-keys: verify-cache-
      - name: Score
        working-directory: tools
        run: python3 score_ptype.py | tee ptype-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptype-results
          path: |
            tools/ptype-results.json
            tools/ptype-report.txt
