name: Hourly now check

# Runs the app's own current-conditions logic for Milton against live data every hour and
# opens (or comments on) an issue when the app's sky or temperature disagrees with the radar
# over Milton or the forecast model. The issue closes itself on the next clean run.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "Packages/WeatherCore/Sources/**"
      - ".github/workflows/now-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: now-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Can this runner reach the services?
        continue-on-error: true
        run: |
          for u in "https://api.open-meteo.com/v1/forecast?latitude=43.513&longitude=-79.882&current=temperature_2m" \
                   "https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetCapabilities&layer=RADAR_1KM_RRAI"; do
            curl -sS -o /dev/null -m 30 -w "%{http_code} in %{time_total}s (connect %{time_connect}s) $u\n" "$u" || echo "FAILED $u"
            curl -4 -sS -o /dev/null -m 30 -w "IPv4: %{http_code} in %{time_total}s\n" "$u" || echo "IPv4 FAILED"
          done
      - name: Run the check
        run: |
          swift run --package-path Packages/WeatherCore NowCheck | tee result.md
          cat result.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Now check: app disagrees with live data"
          gh label create now-check --color D93F0B --description "Hourly live-data check" 2>/dev/null || true
          ISSUE=$(gh issue list --label now-check --state open --json number --jq '.[0].number // empty')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if grep -q '^MISMATCH' result.md; then
            BODY="$(cat result.md)"$'\n\n'"Run: $RUN"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label now-check --body "$BODY"
            fi
          elif [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "Sources agree again. $RUN"
          fi
