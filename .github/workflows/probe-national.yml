name: Probe national forecast sources

# One-off check of what the free national forecast services return (tools/probe_national.py).

on:
  workflow_dispatch:
  push:
    paths:
      - tools/probe_national.py
      - .github/workflows/probe-national.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_national.py
